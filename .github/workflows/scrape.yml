name: DCSE Scholar Matrix Scraper

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    strategy:
      fail-fast: false  # If one chunk fails, let the others continue
      matrix:
        chunk: [0, 1, 2, 3, 4]  # 5 parallel virtual machines

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper for chunk ${{ matrix.chunk }}
        env:
          AUTHOR_IDS: ${{ secrets.AUTHOR_IDS }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          CHUNK_INDEX: ${{ matrix.chunk }}
          PYTHONUNBUFFERED: "1"
        run: python scraper.py
